name: ci

# A pull request gets the checks that block the merge;
# a push to main or to a release branch runs the same set. The release-branch run is what the ci gate of
# advance-release.sh and finalize-release.sh waits for. Three jobs (check, build, test) so each shows as
# its own check.
on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'
      # the branch that carries a train back to main already has a pull request
      - '!release/**--to-main'

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Squash-merge makes the PR title the commit on main, so it must follow Conventional Commits.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: PR title follows Conventional Commits
        run: bash scripts/ci/check-pr-title.sh "$PR_TITLE"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm check

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm build

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm test
