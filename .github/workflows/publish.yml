name: publish

# Publishes the packages a release created (fact-kit, platform-facts) to the public npm registry.
# release-please.yml dispatches it (gh workflow run) after each release; it can also be run by hand. It is
# not a workflow_call target: npm trusts this workflow file as a Trusted Publisher, and a called workflow's
# OIDC token names the caller, which would not match.
#
# npm accepts OIDC tokens only from GitHub-hosted runners. The job is idempotent: a version already in the
# registry is skipped, so re-running after a partial failure is safe.
on:
  workflow_dispatch:
    inputs:
      paths:
        description: 'JSON array of package paths to publish, e.g. ["packages/fact-kit"]'
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

# One pending run per group; only a repeat of the same request waits behind the running one.
concurrency:
  group: publish-${{ inputs.paths }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          registry-url: https://registry.npmjs.org
          cache: 'false'
      - name: Build
        run: pnpm build
      - name: npm CLI new enough for trusted publishing
        run: |
          min=11.5.1
          if [[ "$(printf '%s\n' "$min" "$(npm --version)" | sort -V | head -1)" != "$min" ]]; then
            npm install -g "npm@^$min"
          fi
          npm --version
      # Both packages authenticate with the OIDC token, so this step sets no token. A token here would be sent
      # to registry.npmjs.org by the .npmrc setup-node writes and replace the OIDC exchange.
      - name: Publish to npm (trusted publishing)
        env:
          PATHS: ${{ inputs.paths }}
          PUBLISH_OUT: ${{ runner.temp }}/publish
        run: |
          mapfile -t paths < <(jq -r '.[]' <<<"$PATHS")
          [[ ${#paths[@]} -gt 0 ]] || { echo "no package in this release"; exit 0; }
          bash scripts/release/publish-units.sh "${paths[@]}"
