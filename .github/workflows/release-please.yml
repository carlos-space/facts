name: release-please

# Versioning engine, run on every push to main that touches a package. release-please opens one Release
# PR per component (fact-kit, platform-facts); merging it tags <component>/v<version> and creates the
# GitHub Release. A tag created with GITHUB_TOKEN raises no events, so this workflow dispatches
# publish.yml itself after a release.
#
# A Release PR opened with GITHUB_TOKEN triggers a ci run that waits for approval. Set the repository
# variable RELEASE_PLEASE_APP_CLIENT_ID (and the RELEASE_PLEASE_APP_PRIVATE_KEY secret) and release-please
# runs as the App instead. Without them it falls back to GITHUB_TOKEN; everything else works either way.
on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'release-please-config.json'
      - '.release-please-manifest.json'

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7

      # Only when the App is configured; otherwise the step is skipped and its empty output falls
      # through to GITHUB_TOKEN below. The App needs Contents, Pull requests and Issues (write).
      - id: app-token
        if: vars.RELEASE_PLEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          target-branch: ${{ github.ref_name }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Summary
        env:
          RELEASES_CREATED: ${{ steps.rp.outputs.releases_created }}
          PRS_CREATED: ${{ steps.rp.outputs.prs_created }}
          PATHS_RELEASED: ${{ steps.rp.outputs.paths_released }}
        run: |
          {
            echo "### release-please on \`${GITHUB_REF_NAME}\`"
            echo "- releases_created: ${RELEASES_CREATED}"
            echo "- prs_created: ${PRS_CREATED}"
            echo "- paths_released: ${PATHS_RELEASED}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch publish for released packages
        if: steps.rp.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PATHS: ${{ steps.rp.outputs.paths_released }}
        run: |
          pkgs=$(echo "$PATHS" | jq -c '[.[] | select(test("^packages/[a-z0-9-]+$"))]')
          if [[ "$pkgs" == "[]" ]]; then echo "no packages in this release"; exit 0; fi
          echo "dispatch publish.yml for $pkgs"
          gh workflow run publish.yml --ref "$GITHUB_REF_NAME" -f paths="$pkgs"
